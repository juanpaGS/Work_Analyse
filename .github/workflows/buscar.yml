name: Buscar ofertas

on:
  schedule:
    - cron: "17 6 * * *"   # cada día ~07:17-08:17 hora de España
  workflow_dispatch:

permissions:
  contents: write

jobs:
  buscar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python agente/buscar.py
      - name: Guardar resultados
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/data/ofertas.json
          git diff --cached --quiet || git commit -m "Actualiza ofertas"
          git push
