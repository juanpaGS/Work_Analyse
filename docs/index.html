<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Work Analyse</title>
<meta name="theme-color" content="#0f766e">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Work Analyse">
<style>
:root{--bg:#f4f6f7;--card:#fff;--ink:#16202a;--muted:#5d6b78;--line:#dfe5ea;--brand:#0f766e;--brand-ink:#fff;--chip:#e8eef1;--good:#0f766e;--warn:#b45309}
@media (prefers-color-scheme:dark){:root{--bg:#0e1418;--card:#172026;--ink:#e6edf2;--muted:#93a3b0;--line:#26333c;--brand:#2dd4bf;--brand-ink:#04211e;--chip:#22303a;--good:#2dd4bf;--warn:#fbbf24}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;padding:env(safe-area-inset-top) 0 calc(24px + env(safe-area-inset-bottom))}
header{position:sticky;top:0;z-index:2;background:var(--bg);border-bottom:1px solid var(--line);padding:12px 16px 10px}
.wrap{max-width:760px;margin:0 auto}
h1{font-size:20px;margin:0}
.meta{color:var(--muted);font-size:13px;margin-top:2px}
.tabs,.filtros{display:flex;gap:8px;overflow-x:auto;padding:10px 0 2px;scrollbar-width:none}
button{font:inherit;color:inherit;cursor:pointer}
.chip{flex:none;border:1px solid var(--line);background:var(--card);border-radius:999px;padding:6px 12px;font-size:14px;min-height:36px}
.chip[aria-pressed=true]{background:var(--brand);border-color:var(--brand);color:var(--brand-ink);font-weight:600}
input[type=search]{width:100%;margin-top:10px;padding:10px 12px;border:1px solid var(--line);border-radius:10px;background:var(--card);color:var(--ink);font:inherit}
main{padding:12px 16px}
.oferta{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px;margin-bottom:12px}
.oferta h2{font-size:16px;margin:0 0 2px;line-height:1.3}
.oferta .emp{color:var(--muted);font-size:14px}
.fila{display:flex;flex-wrap:wrap;gap:6px;margin:8px 0}
.tag{background:var(--chip);border-radius:6px;padding:2px 8px;font-size:12.5px}
.tag.nueva{background:var(--brand);color:var(--brand-ink);font-weight:600}
.puntos{float:right;font-weight:700;color:var(--good);font-variant-numeric:tabular-nums;margin-left:8px}
.motivos{color:var(--muted);font-size:13px}
.req{font-size:13.5px;margin-top:6px;padding-left:0;list-style:none}
.req li{padding-left:20px;position:relative;margin-bottom:2px}
.req li::before{position:absolute;left:0;font-weight:700}
.req .ok{color:var(--good)}.req .ok::before{content:"✓"}
.req .ojo{color:var(--warn)}.req .ojo::before{content:"!"}
.acciones{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px}
.btn{border:1px solid var(--line);background:transparent;border-radius:10px;padding:8px 12px;font-size:14px;min-height:40px;text-decoration:none;color:var(--ink)}
.btn.pri{background:var(--brand);border-color:var(--brand);color:var(--brand-ink);font-weight:600}
.btn[aria-pressed=true]{border-color:var(--brand);color:var(--brand);font-weight:600}
.vacio{color:var(--muted);text-align:center;padding:40px 10px}
</style>
</head>
<body>
<header><div class="wrap">
  <h1>Work Analyse</h1>
  <div class="meta" id="meta">Cargando ofertas…</div>
  <div class="tabs" id="tabs" role="group" aria-label="Estado"></div>
  <div class="filtros" id="filtros" role="group" aria-label="Filtros"></div>
  <input type="search" id="q" placeholder="Buscar por puesto o empresa" aria-label="Buscar">
</div></header>
<main><div class="wrap" id="lista"></div></main>
<script>
const ESTADOS = [["pendiente","Por revisar"],["guardada","Guardadas"],["solicitada","Solicitadas"],["descartada","Descartadas"]];
const FILTROS = [["limpia","Sin avisos"],["espana","España"],["Prácticas","Prácticas"],["Junior","Junior"],["IA","IA"],["Datos","Datos"],["Desarrollo","Desarrollo"],["Sistemas","Sistemas"]];
let datos = {ofertas: []}, tab = "pendiente", activos = new Set(), estado = {};
try { estado = JSON.parse(localStorage.getItem("estado") || "{}"); } catch (e) {}
const guardar = () => { try { localStorage.setItem("estado", JSON.stringify(estado)); } catch (e) {} };
const $ = id => document.getElementById(id);
const esc = s => String(s ?? "").replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const de = o => estado[o.id] || "pendiente";

function pinta() {
  const hoy = (datos.generado || "").slice(0, 10), q = $("q").value.trim().toLowerCase();
  $("tabs").innerHTML = ESTADOS.map(([k, t]) => {
    const n = datos.ofertas.filter(o => de(o) === k).length;
    return `<button class="chip" data-tab="${k}" aria-pressed="${tab === k}">${t} · ${n}</button>`;
  }).join("");
  $("filtros").innerHTML = FILTROS.map(([k, t]) =>
    `<button class="chip" data-f="${k}" aria-pressed="${activos.has(k)}">${t}</button>`).join("");
  const vis = datos.ofertas.filter(o => de(o) === tab
    && [...activos].every(f => f === "espana" ? o.espana : f === "limpia" ? !(o.avisos || []).length : (o.nivel === f || o.area === f))
    && (!q || (o.titulo + " " + o.empresa).toLowerCase().includes(q)));
  $("lista").innerHTML = vis.length ? vis.map(o => `
    <article class="oferta">
      <span class="puntos" title="Encaje con tu perfil">${o.puntos}</span>
      <h2>${esc(o.titulo)}</h2>
      <div class="emp">${esc(o.empresa)} · ${esc(o.ubicacion || "Remoto")}</div>
      <div class="fila">
        ${o.vista_desde === hoy ? '<span class="tag nueva">Nueva</span>' : ""}
        <span class="tag">${esc(o.area)}</span><span class="tag">${esc(o.nivel)}</span>
        <span class="tag">${esc(o.fuente)}</span>${o.fecha ? `<span class="tag">${esc(o.fecha)}</span>` : ""}
      </div>
      <div class="motivos">${esc(o.motivos.join(" · "))}</div>
      <ul class="req">
        ${(o.a_favor || []).map(t => `<li class="ok">${esc(t)}</li>`).join("")}
        ${(o.avisos || []).map(t => `<li class="ojo">${esc(t)}</li>`).join("")}
      </ul>
      <div class="acciones">
        <a class="btn pri" href="${esc(o.url)}" target="_blank" rel="noopener">Ver oferta</a>
        ${[["guardada","Guardar"],["solicitada","Solicitada"],["descartada","Descartar"]].map(([k, t]) =>
          `<button class="btn" data-id="${o.id}" data-e="${k}" aria-pressed="${de(o) === k}">${t}</button>`).join("")}
      </div>
    </article>`).join("") : '<p class="vacio">No hay ofertas en esta vista.</p>';
}

document.addEventListener("click", e => {
  const b = e.target.closest("button"); if (!b) return;
  if (b.dataset.tab) tab = b.dataset.tab;
  else if (b.dataset.f) activos.has(b.dataset.f) ? activos.delete(b.dataset.f) : activos.add(b.dataset.f);
  else if (b.dataset.id) { estado[b.dataset.id] = de({id: b.dataset.id}) === b.dataset.e ? "pendiente" : b.dataset.e; guardar(); }
  pinta();
});
$("q").addEventListener("input", pinta);

fetch("data/ofertas.json", {cache: "no-store"}).then(r => r.json()).then(d => {
  datos = d;
  const f = new Date(d.generado);
  $("meta").textContent = `${d.ofertas.length} ofertas de ${d.leidas} revisadas · ${Object.values(d.descartes || {}).reduce((a, b) => a + b, 0)} descartadas por requisitos · actualizado ${f.toLocaleDateString("es-ES", {day: "numeric", month: "short"})} ${f.toLocaleTimeString("es-ES", {hour: "2-digit", minute: "2-digit"})}`;
  pinta();
}).catch(() => { $("meta").textContent = "No se pudieron cargar las ofertas."; pinta(); });

if ("serviceWorker" in navigator) navigator.serviceWorker.register("sw.js").catch(() => {});
</script>
</body>
</html>
